<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeSnap Capture Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Screen Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Dark Overlay Mask -->
  <div id="maskOverlay"></div>

  <!-- Selection Box -->
  <div id="selectionBox" class="hidden">
    <!-- Annotation Canvas layered inside selection box -->
    <canvas id="drawCanvas"></canvas>

    <!-- Selection Resize Handles -->
    <div class="handle handle-nw" data-handle="nw"></div>
    <div class="handle handle-n" data-handle="n"></div>
    <div class="handle handle-ne" data-handle="ne"></div>
    <div class="handle handle-e" data-handle="e"></div>
    <div class="handle handle-se" data-handle="se"></div>
    <div class="handle handle-s" data-handle="s"></div>
    <div class="handle handle-sw" data-handle="sw"></div>
    <div class="handle handle-w" data-handle="w"></div>

    <!-- Dimension Label Tag -->
    <div id="dimensionTag">0 × 0 px</div>
  </div>

  <!-- Floating Action & Tools Bar -->
  <div id="floatingBar" class="floating-bar hidden">
    <!-- Annotation Tools Group -->
    <div class="tool-group">
      <button class="tool-btn active" data-tool="select" title="Selection Mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
      </button>
      <button class="tool-btn" data-tool="pen" title="Freehand Pen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Arrow Pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rectangle Tool">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Text Note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>
      <button class="tool-btn" data-tool="highlight" title="Highlighter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
      </button>
      <button class="tool-btn" data-tool="blur" title="Blur / Redact Sensitive Data">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Color Selector -->
    <div class="color-group">
      <div class="color-dot active" data-color="#ff3b30" style="background-color: #ff3b30;"></div>
      <div class="color-dot" data-color="#34c759" style="background-color: #34c759;"></div>
      <div class="color-dot" data-color="#007aff" style="background-color: #007aff;"></div>
      <div class="color-dot" data-color="#ffcc00" style="background-color: #ffcc00;"></div>
      <div class="color-dot" data-color="#ffffff" style="background-color: #ffffff;"></div>
      <div class="color-dot" data-color="#000000" style="background-color: #000000;"></div>
    </div>

    <div class="divider"></div>

    <!-- Actions Group -->
    <div class="action-group">
      <button class="action-btn" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="action-btn primary" id="btnCopy" title="Copy to Clipboard (Ctrl+C)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy</span>
      </button>
      <button class="action-btn success" id="btnSave" title="Save to File (Ctrl+S)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Save</span>
      </button>
      <button class="action-btn danger" id="btnCancel" title="Cancel (Esc)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Instruction Banner (Shown before selection) -->
  <div id="instructionBanner">
    <span>Click & Drag to select screenshot area &bull; Press <strong>Esc</strong> to exit</span>
  </div>

  <!-- Scripts -->
  <script src="js/annotation.js"></script>
  <script src="js/overlay.js"></script>
  <script src="js/toolbar.js"></script>
</body>
</html>
